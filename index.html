function profBind(){
$('#av').onclick=()=>$('#avf').click();
$('#avf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);const d=c.toDataURL('image/jpeg',.72),j=await api('avatar',{img:d});if(j.ok){U.avatar=d;save();render()}};im.src=r.result};r.readAsDataURL(f)};
$('#fbb').onclick=()=>{view='fb';render()}}
function fbv(){
$('#pg').innerHTML=`<h2>FEEDBACK</h2><div class="glass" style="padding:16px"><textarea id="ft2" maxlength="500" rows="6" placeholder="Write your feedback or criticism…"></textarea><div class="err" id="fe"></div><button class="btn" id="fs" style="width:100%">SEND</button></div>`;
$('#fs').onclick=async()=>{const t=$('#ft2').value.trim();if(!t)return;$('#fs').disabled=1;const j=await api('fb',{text:t});$('#fs').disabled=0;const e=$('#fe');if(!j.ok){e.style.color='';return e.textContent=j.err||'Error'}$('#ft2').value='';e.style.color='#6be585';e.textContent=tt('Sent. Thank you!')}}
function rank(f){
if(!f)sync();
const all=LB.filter(r=>r.name!==U.name).concat([{name:U.name,lv:lvNow()>3?3:lvNow(),taps:U.taps,coins:U.coins,followers:U.followers,me:1}]).sort((a,b)=>b.taps-a.taps);
$('#pg').innerHTML=`<h2>LEADERBOARD</h2>`+all.map((r,i)=>`<div class="glass lb ${i<3?'t'+(i+1):''} ${r.me?'me':''}"><div class="rk">${i+1}</div><div class="nm"><b>${r.name}${r.me?' (you)':''}</b><span class="sm">Level ${r.lv}</span></div><div class="rt"><b style="font-weight:500">${fmt(r.taps)}</b><div class="sm">taps</div><div class="o" style="font-size:12px">${fmt(Math.floor(r.coins))} coins · ${fmt(r.followers||0)} followers</div></div></div>`).join('')}
const UP=[['mt','Multitap','+1 coin per tap',300,1.7],['en','Energy Limit','+250 max energy',250,1.6],['rc','Recharge Speed','+1 energy / sec',400,1.8]];
function upg(){
$('#pg').innerHTML=`<h2>UPGRADES</h2><div class="sm" style="margin-bottom:12px">Coins <b class="o" style="font-size:16px">${fmt(Math.floor(U.coins))}</b></div><div class="cards">`+UP.map(([k,n,d,b,m])=>{const l=U.up[k],c=Math.round(b*Math.pow(m,l));return`<div class="glass card"><div class="ic">${IC.bolt}</div><div style="flex:1"><b>${tt(n)}</b><span class="sm">${tt(d)} · Lv ${l}</span></div><button class="btn" data-k="${k}" data-c="${c}" style="padding:10px 14px;${l>=10?'opacity:.4':''}">${l>=10?'MAX':fmt(c)}</button></div>`}).join('')+'</div>';
$('#pg').onclick=e=>{const b=e.target.closest('button[data-k]');if(!b)return;const k=b.dataset.k,c=+b.dataset.c;if(U.up[k]>=10||U.coins<c){b.classList.add('nz');setTimeout(()=>b.classList.remove('nz'),300);return}U.coins-=c;U.up[k]++;if(k==='en')U.en=Math.min(U.en,emax());save();upg()}}
function rewards(){
$('#pg').innerHTML=`<h2>REWARDS</h2><div class="cards">`+LV.map((L,i)=>{const u=U.rewards.includes(i);return`<div class="glass card rw ${u?'':'lock'}"><div class="ic">${u?IC.gift:IC.lock}</div><div><span class="sm">Level ${i+1} reward</span><b>+${fmt(L.c)} Coins</b>${L.b?'<b>+'+L.b+' Bonus Points</b>':''}</div><span class="badge">${u?'UNLOCKED':'LOCKED'}</span></div>`}).join('')+`</div>`}
document.addEventListener('contextmenu',e=>{if(e.target.closest('#tap'))e.preventDefault()});
boot();setInterval(sync,8000);
let tk=0;setInterval(()=>{if(!U||!T||LS.getItem('te_role')!=='u')return;init();U.en=Math.min(emax(),U.en+rate());
if(U.au&&U.lvl>=1&&U.en>=1&&!document.querySelector('.modal')){const b=document.getElementById('tap');if(b)fx(b,power());core()}
const ev=CFG.ev;if(ev&&ev.active&&ev.left>0){ev.left--;if(document.visibilityState==='visible')U.coins+=ev.pts}U.ts=Date.now();ui();tiles();if(++tk%5===0)save()},1000);
addEventListener('pagehide',()=>{if(U&&T&&LS.getItem('te_role')==='u'){U.ts=Date.now();save();sync()}});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
